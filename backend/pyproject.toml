[project]
name = "knowledge-product-manager"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pgvector>=0.3,<1", "pydantic-settings>=2.5,<3", "minio>=7.2,<8", "redis>=5,<7", "rdflib>=7,<8", "pyshacl>=0.30,<1", "python-multipart>=0.0.20", "pypdf>=5,<7", "python-docx>=1.1,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9"]
embeddings = ["sentence-transformers>=3,<6"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: real Compose adapters", "model: real local embedding model"]
[tool.ruff]
line-length = 110
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
